name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable with PyInstaller
        run: |
          pyinstaller --onefile --name deadbooru --add-data "templates;templates" --add-data "data;data" --add-data "static;static" app.py

      - name: Package Release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist_package\deadbooru" -Force
          Copy-Item -Path "dist\deadbooru.exe" -Destination "dist_package\deadbooru\"
          Copy-Item -Path "settings.example.json" -Destination "dist_package\deadbooru\"
          Copy-Item -Path "README.md" -Destination "dist_package\deadbooru\"
          New-Item -ItemType Directory -Path "dist_package\deadbooru\data" -Force
          Copy-Item -Path "data\tags.csv" -Destination "dist_package\deadbooru\data\"
          Compress-Archive -Path "dist_package\deadbooru\*" -DestinationPath "deadbooru-windows-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            deadbooru-windows-x64.zip
            dist/deadbooru.exe
          draft: false
          prerelease: false
          generate_release_notes: true
